<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Definitions & Styles -->
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .sidebar { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .header { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .text-title { fill: #f8fafc; font-size: 18px; font-weight: 600; }
      .text-heading { fill: #f8fafc; font-size: 15px; font-weight: 600; }
      .text-body { fill: #94a3b8; font-size: 13px; }
      .text-muted { fill: #64748b; font-size: 11px; }
      .btn-primary { fill: #0284c7; rx: 6px; cursor: pointer; }
      .btn-primary-text { fill: #ffffff; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .btn-secondary { fill: #334155; rx: 6px; cursor: pointer; }
      .btn-secondary-text { fill: #f8fafc; font-size: 13px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" class="bg" />

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="60" class="header" />
  <circle cx="36" cy="30" r="14" fill="#0284c7" />
  <path d="M 30 30 L 42 22 L 38 30 L 42 38 Z" fill="#ffffff" />
  <text x="60" y="35" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">UpdatePilot</text>
  <text x="155" y="35" class="text-muted">|</text>
  <text x="170" y="35" fill="#94a3b8" font-size="13">Device: <tspan fill="#f8fafc" font-weight="600">DESKTOP-DINUSHA</tspan></text>

  <!-- Header Right Action -->
  <g transform="translate(930, 13)">
    <rect width="130" height="34" class="btn-primary" />
    <path d="M 18 17 A 6 6 0 1 1 18 21 M 18 12 L 21 16 L 15 16 Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <text x="74" y="22" class="btn-primary-text">Scan now</text>
  </g>
  <circle cx="1090" cy="30" r="16" fill="#334155" />
  <text x="1090" y="35" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">DU</text>

  <!-- Left Sidebar -->
  <rect x="0" y="60" width="220" height="760" class="sidebar" />
  <g transform="translate(16, 85)">
    <text x="36" y="23" class="text-body">Overview</text>
    <rect x="0" y="40" width="188" height="36" fill="#0284c7" fill-opacity="0.2" rx="6" stroke="#0284c7" stroke-width="1" />
    <text x="36" y="63" fill="#38bdf8" font-size="13" font-weight="600">Updates (0)</text>
    <text x="36" y="103" class="text-body">Installed Apps (196)</text>
    <text x="36" y="143" class="text-body">Devices (1)</text>
    <text x="36" y="183" class="text-body">Audit &amp; History</text>
    <text x="36" y="223" class="text-body">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(244, 85)">
    <text x="0" y="22" class="text-title">Available Software Updates</text>
    <text x="0" y="44" class="text-body">Pending updates requiring approval</text>

    <!-- Empty State Container (Everything is Up to Date) -->
    <g transform="translate(0, 75)">
      <rect width="928" height="615" class="card" />

      <!-- Center Shield & Check Icon -->
      <g transform="translate(464, 160)">
        <circle cx="0" cy="0" r="50" fill="#064e3b" stroke="#059669" stroke-width="2" />
        <path d="M 0 -22 L 24 -12 L 24 6 C 24 22 0 32 0 32 C 0 32 -24 22 -24 6 L -24 -12 Z" fill="none" stroke="#10b981" stroke-width="2.5" />
        <path d="M -10 4 L -2 12 L 12 -4" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <text x="464" y="250" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">Everything is Up to Date!</text>
      <text x="464" y="280" fill="#94a3b8" font-size="14" text-anchor="middle">No pending updates found for DESKTOP-DINUSHA.</text>
      <text x="464" y="304" fill="#94a3b8" font-size="14" text-anchor="middle">All 112 managed WinGet applications are running their latest approved release.</text>

      <!-- Last Scan Metadata Badge -->
      <g transform="translate(364, 340)">
        <rect width="200" height="32" fill="#0f172a" rx="16" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#10b981" />
        <text x="105" y="20" fill="#e2e8f0" font-size="12" text-anchor="middle">Last checked: 8 minutes ago</text>
      </g>

      <!-- Primary Action CTA -->
      <g transform="translate(364, 400)">
        <rect width="200" height="42" class="btn-primary" />
        <path d="M 28 21 A 6 6 0 1 1 28 25 M 28 16 L 31 20 L 25 20 Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
        <text x="110" y="26" class="btn-primary-text">Check for Updates Now</text>
      </g>

      <!-- Summary Info Card Box -->
      <g transform="translate(264, 480)">
        <rect width="400" height="70" fill="#0f172a" rx="6" stroke="#334155" stroke-width="1" />
        <text x="20" y="26" class="text-heading">Automatic Verification Active</text>
        <text x="20" y="48" class="text-muted">The Python agent checks for updates upon on-demand scans and never installs software without approval.</text>
      </g>
    </g>
  </g>
</svg>
