<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Definitions & Styles -->
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .sidebar { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .header { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .flyout { fill: #1e293b; stroke: #0284c7; stroke-width: 1.5; rx: 8px; }
      .input-box { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6px; }
      .console-box { fill: #020617; stroke: #334155; stroke-width: 1; rx: 6px; }
      .text-title { fill: #f8fafc; font-size: 18px; font-weight: 600; }
      .text-heading { fill: #f8fafc; font-size: 14px; font-weight: 600; }
      .text-body { fill: #94a3b8; font-size: 13px; }
      .text-muted { fill: #64748b; font-size: 11px; }
      .text-badge { font-size: 10px; font-weight: 600; text-anchor: middle; }
      .btn-primary { fill: #0284c7; rx: 6px; cursor: pointer; }
      .btn-primary-text { fill: #ffffff; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .btn-secondary { fill: #334155; rx: 6px; cursor: pointer; }
      .btn-secondary-text { fill: #cbd5e1; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .badge-success { fill: #064e3b; stroke: #059669; stroke-width: 1; rx: 10px; }
      .badge-danger { fill: #7f1d1d; stroke: #ef4444; stroke-width: 1; rx: 10px; }
      .badge-warning { fill: #78350f; stroke: #d97706; stroke-width: 1; rx: 10px; }
      .badge-info { fill: #0c4a6e; stroke: #0284c7; stroke-width: 1; rx: 10px; }
      .row-divider { stroke: #334155; stroke-width: 1; }
      .row-selected { fill: #0369a1; fill-opacity: 0.15; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" class="bg" />

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="60" class="header" />
  <circle cx="36" cy="30" r="14" fill="#0284c7" />
  <path d="M 30 30 L 42 22 L 38 30 L 42 38 Z" fill="#ffffff" />
  <text x="60" y="35" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">UpdatePilot</text>
  <text x="155" y="35" class="text-muted">|</text>
  <text x="170" y="35" fill="#94a3b8" font-size="13">Device: <tspan fill="#f8fafc" font-weight="600">DESKTOP-DINUSHA</tspan></text>

  <!-- Header Right Action -->
  <g transform="translate(930, 13)">
    <rect width="130" height="34" class="btn-primary" />
    <path d="M 18 17 A 6 6 0 1 1 18 21 M 18 12 L 21 16 L 15 16 Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <text x="74" y="22" class="btn-primary-text">Scan now</text>
  </g>
  <circle cx="1090" cy="30" r="16" fill="#334155" />
  <text x="1090" y="35" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">DU</text>

  <!-- Left Sidebar -->
  <rect x="0" y="60" width="220" height="760" class="sidebar" />
  <g transform="translate(16, 85)">
    <text x="36" y="23" class="text-body">Overview</text>
    <text x="36" y="63" class="text-body">Updates (33)</text>
    <text x="36" y="103" class="text-body">Installed Apps (196)</text>
    <text x="36" y="143" class="text-body">Devices (1)</text>
    <!-- Active Nav: Audit & History -->
    <rect x="0" y="160" width="188" height="36" fill="#0284c7" fill-opacity="0.2" rx="6" stroke="#0284c7" stroke-width="1" />
    <text x="36" y="183" fill="#38bdf8" font-size="13" font-weight="600">Audit &amp; History</text>
    <text x="36" y="223" class="text-body">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(244, 85)">
    <!-- Title -->
    <text x="0" y="22" class="text-title">Job &amp; Audit History</text>
    <text x="0" y="44" class="text-body">Immutable chronological ledger of scans, approvals, rejections, and execution results</text>

    <!-- Filters Toolbar (630px wide) -->
    <g transform="translate(0, 60)">
      <!-- Filter: Job Type -->
      <g transform="translate(0, 0)">
        <rect width="160" height="36" class="input-box" />
        <text x="14" y="22" class="text-body">Type: <tspan fill="#f8fafc">All (Scan/Update)</tspan></text>
        <path d="M 140 15 L 145 20 L 150 15 Z" fill="#64748b" />
      </g>

      <!-- Filter: Status -->
      <g transform="translate(170, 0)">
        <rect width="130" height="36" class="input-box" />
        <text x="14" y="22" class="text-body">Status: <tspan fill="#f8fafc">All Statuses</tspan></text>
        <path d="M 110 15 L 115 20 L 120 15 Z" fill="#64748b" />
      </g>

      <!-- Filter: Date Range -->
      <g transform="translate(310, 0)">
        <rect width="130" height="36" class="input-box" />
        <text x="14" y="22" class="text-body">Date: <tspan fill="#f8fafc">Last 7 Days</tspan></text>
        <path d="M 110 15 L 115 20 L 120 15 Z" fill="#64748b" />
      </g>

      <!-- Search Input -->
      <g transform="translate(450, 0)">
        <rect width="180" height="36" class="input-box" />
        <text x="14" y="22" class="text-muted">Search package or job ID...</text>
      </g>
    </g>

    <!-- Jobs Table (Left: 630px wide) -->
    <g transform="translate(0, 110)">
      <rect width="630" height="580" class="card" />

      <!-- Table Header -->
      <text x="16" y="26" class="text-muted">JOB / EVENT ↕</text>
      <text x="175" y="26" class="text-muted">TARGET</text>
      <text x="315" y="26" class="text-muted">STATUS</text>
      <text x="430" y="26" class="text-muted">OPERATOR</text>
      <text x="530" y="26" class="text-muted">TIME ↕</text>
      <line x1="16" y1="36" x2="614" y2="36" class="row-divider" />

      <!-- Row 1: Git Update (Selected Row) -->
      <rect x="2" y="38" width="626" height="52" class="row-selected" />
      <g transform="translate(16, 48)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">Update: Git</text>
        <text x="0" y="30" class="text-muted">job_8f29ab01</text>
        <text x="160" y="16" class="text-body">Git.Git</text>
        <text x="160" y="30" class="text-muted">2.50.0 ➔ 2.56.0</text>
        <!-- Success Badge -->
        <rect x="298" y="8" width="70" height="20" class="badge-success" />
        <text x="333" y="22" fill="#10b981" class="text-badge">Success (0)</text>
        <text x="414" y="22" class="text-body">Dinusha</text>
        <text x="514" y="22" class="text-muted">15m ago</text>
      </g>
      <line x1="16" y1="90" x2="614" y2="90" class="row-divider" />

      <!-- Row 2: Scan Completed -->
      <g transform="translate(16, 100)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">Host Scan</text>
        <text x="0" y="30" class="text-muted">job_77da41e2</text>
        <text x="160" y="16" class="text-body">Full Inventory</text>
        <text x="160" y="30" class="text-muted">196 discovered</text>
        <rect x="298" y="8" width="70" height="20" class="badge-success" />
        <text x="333" y="22" fill="#10b981" class="text-badge">Success (0)</text>
        <text x="414" y="22" class="text-body">System</text>
        <text x="514" y="22" class="text-muted">1h ago</text>
      </g>
      <line x1="16" y1="142" x2="614" y2="142" class="row-divider" />

      <!-- Row 3: Notepad++ Update (Success) -->
      <g transform="translate(16, 152)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">Update: Notepad++</text>
        <text x="0" y="30" class="text-muted">job_61bb93c0</text>
        <text x="160" y="16" class="text-body">Notepad++.Notepad++</text>
        <text x="160" y="30" class="text-muted">8.6.4 ➔ 8.6.5</text>
        <rect x="298" y="8" width="70" height="20" class="badge-success" />
        <text x="333" y="22" fill="#10b981" class="text-badge">Success (0)</text>
        <text x="414" y="22" class="text-body">Dinusha</text>
        <text x="514" y="22" class="text-muted">3h ago</text>
      </g>
      <line x1="16" y1="194" x2="614" y2="194" class="row-divider" />

      <!-- Row 4: Zoom Update (Rejected) -->
      <g transform="translate(16, 204)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">Update: Zoom</text>
        <text x="0" y="30" class="text-muted">job_50a8912d</text>
        <text x="160" y="16" class="text-body">Zoom.Zoom.EXE</text>
        <text x="160" y="30" class="text-muted">Dismissed 7.2.1</text>
        <rect x="298" y="8" width="70" height="20" class="badge-warning" />
        <text x="333" y="22" fill="#f59e0b" class="text-badge">Rejected</text>
        <text x="414" y="22" class="text-body">Dinusha</text>
        <text x="514" y="22" class="text-muted">Yesterday</text>
      </g>
      <line x1="16" y1="246" x2="614" y2="246" class="row-divider" />

      <!-- Row 5: VS Community Update (Failed) -->
      <g transform="translate(16, 256)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">Update: VS Community</text>
        <text x="0" y="30" class="text-muted">job_4f8812c4</text>
        <text x="160" y="16" class="text-body">Microsoft.VS.2022</text>
        <text x="160" y="30" class="text-muted">17.10 ➔ 17.14</text>
        <rect x="298" y="8" width="70" height="20" class="badge-danger" />
        <text x="333" y="22" fill="#ef4444" class="text-badge">Failed (1603)</text>
        <text x="414" y="22" class="text-body">Dinusha</text>
        <text x="514" y="22" class="text-muted">2 days ago</text>
      </g>
      <line x1="16" y1="298" x2="614" y2="298" class="row-divider" />

      <!-- Row 6: Device Pairing Event -->
      <g transform="translate(16, 308)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">Device Paired</text>
        <text x="0" y="30" class="text-muted">job_1a2b3c4d</text>
        <text x="160" y="16" class="text-body">DESKTOP-DINUSHA</text>
        <text x="160" y="30" class="text-muted">Token pairing</text>
        <rect x="298" y="8" width="70" height="20" class="badge-info" />
        <text x="333" y="22" fill="#38bdf8" class="text-badge">Paired</text>
        <text x="414" y="22" class="text-body">Dinusha</text>
        <text x="514" y="22" class="text-muted">Oct 29</text>
      </g>

      <!-- Pagination Footer -->
      <g transform="translate(16, 535)">
        <line x1="0" y1="0" x2="598" y2="0" class="row-divider" />
        <text x="0" y="24" class="text-muted">Showing 1 to 6 of 28 events</text>
        <g transform="translate(420, 8)">
          <rect width="28" height="24" class="btn-secondary" />
          <text x="14" y="16" class="btn-secondary-text">&lt;</text>
          <rect x="34" y="0" width="28" height="24" fill="#0284c7" rx="4" />
          <text x="48" y="16" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">1</text>
          <rect x="68" y="0" width="28" height="24" class="btn-secondary" />
          <text x="82" y="16" class="btn-secondary-text">2</text>
          <rect x="102" y="0" width="28" height="24" class="btn-secondary" />
          <text x="116" y="16" class="btn-secondary-text">3</text>
          <rect x="136" y="0" width="28" height="24" class="btn-secondary" />
          <text x="150" y="16" class="btn-secondary-text">&gt;</text>
        </g>
      </g>
    </g>

    <!-- Job Detail View Flyout Panel (Right: 280px wide) -->
    <g transform="translate(648, 110)">
      <rect width="280" height="580" class="flyout" />

      <!-- Panel Header -->
      <g transform="translate(18, 20)">
        <text x="0" y="16" class="text-heading">Job Execution Details</text>
        <line x1="0" y1="28" x2="244" y2="28" class="row-divider" />
      </g>

      <!-- Job Identity & Status Badge -->
      <g transform="translate(18, 58)">
        <rect width="90" height="20" class="badge-success" />
        <text x="45" y="14" fill="#10b981" class="text-badge">SUCCESS</text>
        <text x="100" y="15" fill="#f8fafc" font-size="12" font-weight="600">Exit Code: 0</text>

        <text x="0" y="38" fill="#f8fafc" font-size="14" font-weight="700">Git for Windows</text>
        <text x="0" y="52" fill="#38bdf8" font-size="11">Job ID: job_8f29ab01</text>
      </g>

      <!-- Before and After Versions Diff Box -->
      <g transform="translate(18, 125)">
        <rect width="244" height="66" fill="#0f172a" rx="6" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" class="text-muted">INSTALLED BEFORE</text>
        <text x="14" y="44" class="text-body" font-size="14" font-weight="600">2.50.0.2</text>

        <text x="110" y="36" fill="#10b981" font-size="16">→</text>

        <text x="135" y="20" fill="#10b981" font-size="10" font-weight="600">VERIFIED AFTER</text>
        <text x="135" y="44" fill="#10b981" font-size="15" font-weight="700">2.56.0.3</text>
      </g>

      <!-- Metadata Attributes -->
      <g transform="translate(18, 205)">
        <text x="0" y="12" class="text-muted">TARGET DEVICE</text>
        <text x="0" y="26" fill="#f8fafc" font-size="12">DESKTOP-DINUSHA</text>

        <text x="0" y="48" class="text-muted">TRIGGERED BY</text>
        <text x="0" y="62" fill="#f8fafc" font-size="12">Dinusha (Explicit Approval)</text>

        <text x="0" y="84" class="text-muted">START TIME &amp; DURATION</text>
        <text x="0" y="98" fill="#f8fafc" font-size="12">Today at 17:15:02 (Duration: 42s)</text>

        <text x="0" y="120" class="text-muted">COMMAND EXECUTED</text>
        <rect y="126" width="244" height="32" fill="#020617" rx="4" />
        <text x="6" y="146" fill="#38bdf8" font-family="'Consolas', monospace" font-size="9">winget upgrade --id Git.Git --exact</text>
      </g>

      <!-- Subprocess Log Extract Box -->
      <g transform="translate(18, 385)">
        <text x="0" y="12" class="text-muted">STDOUT CAPTURE:</text>
        <rect y="18" width="244" height="110" class="console-box" />
        <g transform="translate(8, 32)">
          <text x="0" y="0" fill="#94a3b8" font-family="'Consolas', monospace" font-size="9">&gt; Verified installer hash SHA256</text>
          <text x="0" y="16" fill="#94a3b8" font-family="'Consolas', monospace" font-size="9">&gt; Starting package install...</text>
          <text x="0" y="32" fill="#94a3b8" font-family="'Consolas', monospace" font-size="9">&gt; Successfully installed</text>
          <text x="0" y="48" fill="#10b981" font-family="'Consolas', monospace" font-size="9">&gt; Post-check: v2.56.0.3 verified</text>
          <text x="0" y="64" fill="#38bdf8" font-family="'Consolas', monospace" font-size="9">&gt; Exit code: 0 (S_OK)</text>
        </g>
      </g>

      <!-- Copy Log Action Button -->
      <g transform="translate(18, 528)">
        <rect width="244" height="34" class="btn-secondary" />
        <text x="122" y="21" class="btn-secondary-text">Copy Full Diagnostics Log</text>
      </g>
    </g>
  </g>
</svg>
