<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Definitions & Styles -->
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .sidebar { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .header { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .card-accent { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; rx: 8px; }
      .text-title { fill: #f8fafc; font-size: 18px; font-weight: 600; }
      .text-heading { fill: #f8fafc; font-size: 14px; font-weight: 600; }
      .text-body { fill: #94a3b8; font-size: 13px; }
      .text-muted { fill: #64748b; font-size: 11px; }
      .text-stat { fill: #f8fafc; font-size: 26px; font-weight: 700; }
      .text-badge { font-size: 11px; font-weight: 600; }
      .btn-primary { fill: #0284c7; rx: 6px; cursor: pointer; }
      .btn-primary-text { fill: #ffffff; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .badge-success { fill: #064e3b; stroke: #059669; stroke-width: 1; rx: 12px; }
      .badge-warning { fill: #78350f; stroke: #d97706; stroke-width: 1; rx: 12px; }
      .badge-info { fill: #0c4a6e; stroke: #0284c7; stroke-width: 1; rx: 12px; }
      .row-divider { stroke: #334155; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" class="bg" />

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="60" class="header" />
  <!-- Logo / Brand -->
  <circle cx="36" cy="30" r="14" fill="#0284c7" />
  <path d="M 30 30 L 42 22 L 38 30 L 42 38 Z" fill="#ffffff" />
  <text x="60" y="35" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">UpdatePilot</text>
  <text x="155" y="35" class="text-muted">|</text>
  <text x="170" y="35" fill="#94a3b8" font-size="13">Device: <tspan fill="#f8fafc" font-weight="600">DESKTOP-DINUSHA</tspan> (Windows 11)</text>

  <!-- Header Right Actions -->
  <g transform="translate(930, 13)">
    <rect width="130" height="34" class="btn-primary" />
    <!-- Refresh Icon -->
    <path d="M 18 17 A 6 6 0 1 1 18 21 M 18 12 L 21 16 L 15 16 Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <text x="74" y="22" class="btn-primary-text">Scan now</text>
  </g>
  <circle cx="1090" cy="30" r="16" fill="#334155" />
  <text x="1090" y="35" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">DU</text>

  <!-- Left Sidebar -->
  <rect x="0" y="60" width="220" height="760" class="sidebar" />
  <!-- Nav Items -->
  <g transform="translate(16, 85)">
    <rect x="0" y="0" width="188" height="36" fill="#0284c7" fill-opacity="0.2" rx="6" stroke="#0284c7" stroke-width="1" />
    <text x="36" y="23" fill="#38bdf8" font-size="13" font-weight="600">Overview</text>

    <text x="36" y="63" class="text-body">Updates (33)</text>
    <text x="36" y="103" class="text-body">Installed Apps (196)</text>
    <text x="36" y="143" class="text-body">Devices (1)</text>
    <text x="36" y="183" class="text-body">Audit &amp; History</text>
    <text x="36" y="223" class="text-body">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(244, 85)">
    <!-- Page Title -->
    <text x="0" y="22" class="text-title">Dashboard Overview</text>
    <text x="0" y="44" class="text-body">Host software inventory and update approval center</text>

    <!-- 5 Summary Metric Cards -->
    <!-- Card 1: Total Apps -->
    <g transform="translate(0, 65)">
      <rect width="176" height="100" class="card" />
      <text x="16" y="28" class="text-body">Total Apps</text>
      <text x="16" y="66" class="text-stat">196</text>
      <text x="16" y="86" class="text-muted">112 managed via WinGet</text>
    </g>

    <!-- Card 2: Updates Available (Accent) -->
    <g transform="translate(188, 65)">
      <rect width="176" height="100" class="card-accent" />
      <text x="16" y="28" fill="#38bdf8" font-size="13" font-weight="600">Updates Available</text>
      <text x="16" y="66" fill="#38bdf8" font-size="26" font-weight="700">33</text>
      <rect x="70" y="46" width="90" height="20" class="badge-warning" />
      <text x="115" y="60" fill="#f59e0b" class="text-badge" text-anchor="middle">Need Approval</text>
      <text x="16" y="86" class="text-muted">Explicit approval required</text>
    </g>

    <!-- Card 3: Unsupported / Unmanaged -->
    <g transform="translate(376, 65)">
      <rect width="176" height="100" class="card" />
      <text x="16" y="28" class="text-body">Unsupported</text>
      <text x="16" y="66" class="text-stat">84</text>
      <text x="16" y="86" class="text-muted">Legacy ARP / Store MSIX</text>
    </g>

    <!-- Card 4: Last Scan -->
    <g transform="translate(564, 65)">
      <rect width="176" height="100" class="card" />
      <text x="16" y="28" class="text-body">Last Scan</text>
      <text x="16" y="62" fill="#f8fafc" font-size="17" font-weight="600">10m ago</text>
      <rect x="16" y="72" width="70" height="18" class="badge-success" />
      <text x="51" y="85" fill="#10b981" class="text-badge" text-anchor="middle">Success</text>
    </g>

    <!-- Card 5: Agent Status -->
    <g transform="translate(752, 65)">
      <rect width="176" height="100" class="card" />
      <text x="16" y="28" class="text-body">Agent Status</text>
      <circle cx="24" cy="54" r="5" fill="#10b981" />
      <text x="36" y="58" fill="#f8fafc" font-size="16" font-weight="600">Online</text>
      <text x="16" y="86" class="text-muted">WinGet v1.29 / Py 3.14</text>
    </g>

    <!-- Main Grid: Left Side Pending Updates Preview, Right Side Recent Activity -->
    <!-- Pending Approvals Quick Table -->
    <g transform="translate(0, 185)">
      <rect width="552" height="520" class="card" />
      <text x="20" y="32" class="text-heading">Action Required: Pending Updates</text>
      <text x="470" y="32" fill="#38bdf8" font-size="12" font-weight="600">View all (33) →</text>
      <line x1="20" y1="46" x2="532" y2="46" class="row-divider" />

      <!-- Table Header -->
      <text x="20" y="68" class="text-muted">APPLICATION</text>
      <text x="240" y="68" class="text-muted">INSTALLED</text>
      <text x="340" y="68" class="text-muted">AVAILABLE</text>
      <text x="450" y="68" class="text-muted">ACTION</text>
      <line x1="20" y1="78" x2="532" y2="78" class="row-divider" />

      <!-- Row 1: Git -->
      <g transform="translate(20, 95)">
        <text x="0" y="14" fill="#f8fafc" font-size="13" font-weight="600">Git for Windows</text>
        <text x="0" y="28" class="text-muted">Git.Git • winget</text>
        <text x="220" y="20" class="text-body">2.50.0.2</text>
        <text x="320" y="20" fill="#38bdf8" font-size="13" font-weight="600">2.56.0.3</text>
        <rect x="420" y="4" width="72" height="24" fill="#0284c7" rx="4" />
        <text x="456" y="20" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Approve</text>
      </g>
      <line x1="20" y1="135" x2="532" y2="135" class="row-divider" />

      <!-- Row 2: 7-Zip -->
      <g transform="translate(20, 150)">
        <text x="0" y="14" fill="#f8fafc" font-size="13" font-weight="600">7-Zip 24.09 (x64)</text>
        <text x="0" y="28" class="text-muted">7zip.7zip • winget</text>
        <text x="220" y="20" class="text-body">24.09</text>
        <text x="320" y="20" fill="#38bdf8" font-size="13" font-weight="600">26.05</text>
        <rect x="420" y="4" width="72" height="24" fill="#0284c7" rx="4" />
        <text x="456" y="20" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Approve</text>
      </g>
      <line x1="20" y1="190" x2="532" y2="190" class="row-divider" />

      <!-- Row 3: VLC Media Player -->
      <g transform="translate(20, 205)">
        <text x="0" y="14" fill="#f8fafc" font-size="13" font-weight="600">VLC media player</text>
        <text x="0" y="28" class="text-muted">VideoLAN.VLC • winget</text>
        <text x="220" y="20" class="text-body">3.0.21</text>
        <text x="320" y="20" fill="#38bdf8" font-size="13" font-weight="600">3.0.24</text>
        <rect x="420" y="4" width="72" height="24" fill="#0284c7" rx="4" />
        <text x="456" y="20" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Approve</text>
      </g>
      <line x1="20" y1="245" x2="532" y2="245" class="row-divider" />

      <!-- Row 4: Node.js -->
      <g transform="translate(20, 260)">
        <text x="0" y="14" fill="#f8fafc" font-size="13" font-weight="600">Node.js LTS</text>
        <text x="0" y="28" class="text-muted">OpenJS.NodeJS.LTS • winget</text>
        <text x="220" y="20" class="text-body">24.13.0</text>
        <text x="320" y="20" fill="#38bdf8" font-size="13" font-weight="600">26.13.0</text>
        <rect x="420" y="4" width="72" height="24" fill="#0284c7" rx="4" />
        <text x="456" y="20" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Approve</text>
      </g>
      <line x1="20" y1="300" x2="532" y2="300" class="row-divider" />

      <!-- Row 5: Windows Terminal -->
      <g transform="translate(20, 315)">
        <text x="0" y="14" fill="#f8fafc" font-size="13" font-weight="600">Windows Terminal</text>
        <text x="0" y="28" class="text-muted">Microsoft.WindowsTerminal • winget</text>
        <text x="220" y="20" class="text-body">1.24.12741</text>
        <text x="320" y="20" fill="#38bdf8" font-size="13" font-weight="600">1.25.2733</text>
        <rect x="420" y="4" width="72" height="24" fill="#0284c7" rx="4" />
        <text x="456" y="20" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Approve</text>
      </g>
      <line x1="20" y1="355" x2="532" y2="355" class="row-divider" />

      <!-- Policy Guarantee Note -->
      <g transform="translate(20, 460)">
        <rect width="492" height="40" fill="#0f172a" rx="6" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="20" r="8" fill="#0284c7" />
        <text x="20" y="24" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">i</text>
        <text x="38" y="24" fill="#94a3b8" font-size="12">Updates are never installed automatically. Click Approve to queue.</text>
      </g>
    </g>

    <!-- Recent Activity Feed -->
    <g transform="translate(572, 185)">
      <rect width="356" height="520" class="card" />
      <text x="20" y="32" class="text-heading">Recent Activity</text>
      <line x1="20" y1="46" x2="336" y2="46" class="row-divider" />

      <!-- Activity Item 1 -->
      <g transform="translate(20, 65)">
        <circle cx="10" cy="10" r="4" fill="#10b981" />
        <text x="24" y="10" fill="#f8fafc" font-size="12" font-weight="600">Scan Completed</text>
        <text x="24" y="24" class="text-muted">Discovered 33 updates across 196 apps</text>
        <text x="24" y="38" fill="#64748b" font-size="10">10 minutes ago</text>
      </g>
      <line x1="20" y1="115" x2="336" y2="115" class="row-divider" />

      <!-- Activity Item 2 -->
      <g transform="translate(20, 125)">
        <circle cx="10" cy="10" r="4" fill="#0284c7" />
        <text x="24" y="10" fill="#f8fafc" font-size="12" font-weight="600">Update Installed: Notepad++</text>
        <text x="24" y="24" class="text-muted">Upgraded to v8.6.5 (Exit Code 0)</text>
        <text x="24" y="38" fill="#64748b" font-size="10">2 hours ago • Approved by Dinusha</text>
      </g>
      <line x1="20" y1="175" x2="336" y2="175" class="row-divider" />

      <!-- Activity Item 3 -->
      <g transform="translate(20, 185)">
        <circle cx="10" cy="10" r="4" fill="#f59e0b" />
        <text x="24" y="10" fill="#f8fafc" font-size="12" font-weight="600">Update Approved: Notepad++</text>
        <text x="24" y="24" class="text-muted">Queued for agent execution</text>
        <text x="24" y="38" fill="#64748b" font-size="10">2 hours ago • By Dinusha</text>
      </g>
      <line x1="20" y1="235" x2="336" y2="235" class="row-divider" />

      <!-- Activity Item 4 -->
      <g transform="translate(20, 245)">
        <circle cx="10" cy="10" r="4" fill="#ef4444" />
        <text x="24" y="10" fill="#f8fafc" font-size="12" font-weight="600">Update Rejected: Zoom</text>
        <text x="24" y="24" class="text-muted">Dismissed version 7.2.1</text>
        <text x="24" y="38" fill="#64748b" font-size="10">Yesterday • By Dinusha</text>
      </g>
      <line x1="20" y1="295" x2="336" y2="295" class="row-divider" />

      <!-- Activity Item 5 -->
      <g transform="translate(20, 305)">
        <circle cx="10" cy="10" r="4" fill="#10b981" />
        <text x="24" y="10" fill="#f8fafc" font-size="12" font-weight="600">Device Paired</text>
        <text x="24" y="24" class="text-muted">DESKTOP-DINUSHA registered</text>
        <text x="24" y="38" fill="#64748b" font-size="10">Oct 29, 2026</text>
      </g>
    </g>
  </g>
</svg>
