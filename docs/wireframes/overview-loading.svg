<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Definitions & Styles -->
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .sidebar { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .header { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .skeleton-block { fill: #334155; rx: 4px; }
      .skeleton-dark { fill: #1e293b; rx: 4px; }
      .text-title { fill: #f8fafc; font-size: 18px; font-weight: 600; }
      .text-body { fill: #94a3b8; font-size: 13px; }
      .text-muted { fill: #64748b; font-size: 11px; }
      .btn-loading { fill: #075985; rx: 6px; }
      .btn-loading-text { fill: #e0f2fe; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .banner-loading { fill: #0c4a6e; stroke: #0284c7; stroke-width: 1; rx: 6px; }
      .row-divider { stroke: #334155; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" class="bg" />

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="60" class="header" />
  <circle cx="36" cy="30" r="14" fill="#0284c7" />
  <path d="M 30 30 L 42 22 L 38 30 L 42 38 Z" fill="#ffffff" />
  <text x="60" y="35" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">UpdatePilot</text>
  <text x="155" y="35" class="text-muted">|</text>
  <text x="170" y="35" fill="#94a3b8" font-size="13">Device: <tspan fill="#f8fafc" font-weight="600">DESKTOP-DINUSHA</tspan> (Windows 11)</text>

  <!-- Header Right Loading Button -->
  <g transform="translate(900, 13)">
    <rect width="160" height="34" class="btn-loading" />
    <!-- Spinner Ring -->
    <circle cx="24" cy="17" r="7" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="24 10" />
    <text x="94" y="22" class="btn-loading-text">Scanning host...</text>
  </g>
  <circle cx="1090" cy="30" r="16" fill="#334155" />
  <text x="1090" y="35" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">DU</text>

  <!-- Left Sidebar -->
  <rect x="0" y="60" width="220" height="760" class="sidebar" />
  <g transform="translate(16, 85)">
    <rect x="0" y="0" width="188" height="36" fill="#0284c7" fill-opacity="0.2" rx="6" stroke="#0284c7" stroke-width="1" />
    <text x="36" y="23" fill="#38bdf8" font-size="13" font-weight="600">Overview</text>
    <text x="36" y="63" class="text-body">Updates (...)</text>
    <text x="36" y="103" class="text-body">Installed Apps (...)</text>
    <text x="36" y="143" class="text-body">Devices (1)</text>
    <text x="36" y="183" class="text-body">Audit &amp; History</text>
    <text x="36" y="223" class="text-body">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(244, 85)">
    <!-- Page Title -->
    <text x="0" y="22" class="text-title">Dashboard Overview</text>
    <text x="0" y="44" class="text-body">Host software inventory and update approval center</text>

    <!-- Scan Progress Banner -->
    <g transform="translate(0, 58)">
      <rect width="928" height="42" class="banner-loading" />
      <circle cx="24" cy="21" r="8" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="25 15" />
      <text x="44" y="26" fill="#e0f2fe" font-size="13" font-weight="600">Executing WinGet inspection on DESKTOP-DINUSHA...</text>
      <text x="560" y="26" fill="#7dd3fc" font-size="12">Stage: Parsing 'winget list' and 'winget upgrade'</text>
    </g>

    <!-- 5 Summary Metric Cards (Skeleton Shimmer) -->
    <!-- Card 1 -->
    <g transform="translate(0, 115)">
      <rect width="176" height="100" class="card" />
      <rect x="16" y="18" width="80" height="12" class="skeleton-block" />
      <rect x="16" y="44" width="60" height="26" class="skeleton-block" />
      <rect x="16" y="78" width="120" height="10" class="skeleton-block" opacity="0.6" />
    </g>

    <!-- Card 2 -->
    <g transform="translate(188, 115)">
      <rect width="176" height="100" class="card" />
      <rect x="16" y="18" width="100" height="12" class="skeleton-block" />
      <rect x="16" y="44" width="50" height="26" class="skeleton-block" />
      <rect x="16" y="78" width="130" height="10" class="skeleton-block" opacity="0.6" />
    </g>

    <!-- Card 3 -->
    <g transform="translate(376, 115)">
      <rect width="176" height="100" class="card" />
      <rect x="16" y="18" width="80" height="12" class="skeleton-block" />
      <rect x="16" y="44" width="55" height="26" class="skeleton-block" />
      <rect x="16" y="78" width="110" height="10" class="skeleton-block" opacity="0.6" />
    </g>

    <!-- Card 4 -->
    <g transform="translate(564, 115)">
      <rect width="176" height="100" class="card" />
      <rect x="16" y="18" width="70" height="12" class="skeleton-block" />
      <rect x="16" y="44" width="70" height="22" class="skeleton-block" />
      <rect x="16" y="76" width="80" height="14" class="skeleton-block" opacity="0.6" />
    </g>

    <!-- Card 5 -->
    <g transform="translate(752, 115)">
      <rect width="176" height="100" class="card" />
      <rect x="16" y="18" width="75" height="12" class="skeleton-block" />
      <rect x="16" y="44" width="65" height="22" class="skeleton-block" />
      <rect x="16" y="76" width="120" height="10" class="skeleton-block" opacity="0.6" />
    </g>

    <!-- Skeleton Tables & Feed -->
    <!-- Left Skeleton Panel -->
    <g transform="translate(0, 230)">
      <rect width="552" height="475" class="card" />
      <rect x="20" y="20" width="220" height="16" class="skeleton-block" />
      <line x1="20" y1="48" x2="532" y2="48" class="row-divider" />

      <!-- Skeleton Row 1 -->
      <rect x="20" y="65" width="160" height="14" class="skeleton-block" />
      <rect x="20" y="85" width="100" height="10" class="skeleton-block" opacity="0.5" />
      <rect x="240" y="70" width="60" height="14" class="skeleton-block" />
      <rect x="340" y="70" width="60" height="14" class="skeleton-block" />
      <rect x="440" y="65" width="70" height="24" class="skeleton-block" />
      <line x1="20" y1="110" x2="532" y2="110" class="row-divider" />

      <!-- Skeleton Row 2 -->
      <rect x="20" y="125" width="140" height="14" class="skeleton-block" />
      <rect x="20" y="145" width="90" height="10" class="skeleton-block" opacity="0.5" />
      <rect x="240" y="130" width="60" height="14" class="skeleton-block" />
      <rect x="340" y="130" width="60" height="14" class="skeleton-block" />
      <rect x="440" y="125" width="70" height="24" class="skeleton-block" />
      <line x1="20" y1="170" x2="532" y2="170" class="row-divider" />

      <!-- Skeleton Row 3 -->
      <rect x="20" y="185" width="180" height="14" class="skeleton-block" />
      <rect x="20" y="205" width="110" height="10" class="skeleton-block" opacity="0.5" />
      <rect x="240" y="190" width="60" height="14" class="skeleton-block" />
      <rect x="340" y="190" width="60" height="14" class="skeleton-block" />
      <rect x="440" y="185" width="70" height="24" class="skeleton-block" />
      <line x1="20" y1="230" x2="532" y2="230" class="row-divider" />

      <!-- Skeleton Row 4 -->
      <rect x="20" y="245" width="150" height="14" class="skeleton-block" />
      <rect x="20" y="265" width="95" height="10" class="skeleton-block" opacity="0.5" />
      <rect x="240" y="250" width="60" height="14" class="skeleton-block" />
      <rect x="340" y="250" width="60" height="14" class="skeleton-block" />
      <rect x="440" y="245" width="70" height="24" class="skeleton-block" />
    </g>

    <!-- Right Skeleton Panel -->
    <g transform="translate(572, 230)">
      <rect width="356" height="475" class="card" />
      <rect x="20" y="20" width="140" height="16" class="skeleton-block" />
      <line x1="20" y1="48" x2="336" y2="48" class="row-divider" />

      <!-- Item 1 -->
      <circle cx="28" cy="75" r="6" class="skeleton-block" />
      <rect x="44" y="68" width="120" height="14" class="skeleton-block" />
      <rect x="44" y="88" width="180" height="10" class="skeleton-block" opacity="0.5" />
      <line x1="20" y1="115" x2="336" y2="115" class="row-divider" />

      <!-- Item 2 -->
      <circle cx="28" cy="135" r="6" class="skeleton-block" />
      <rect x="44" y="128" width="140" height="14" class="skeleton-block" />
      <rect x="44" y="148" width="160" height="10" class="skeleton-block" opacity="0.5" />
      <line x1="20" y1="175" x2="336" y2="175" class="row-divider" />

      <!-- Item 3 -->
      <circle cx="28" cy="195" r="6" class="skeleton-block" />
      <rect x="44" y="188" width="110" height="14" class="skeleton-block" />
      <rect x="44" y="208" width="150" height="10" class="skeleton-block" opacity="0.5" />
    </g>
  </g>
</svg>
