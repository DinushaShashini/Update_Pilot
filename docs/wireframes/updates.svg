<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Definitions & Styles -->
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .sidebar { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .header { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .card-preview { fill: #1e293b; stroke: #0284c7; stroke-width: 1.5; rx: 8px; }
      .text-title { fill: #f8fafc; font-size: 18px; font-weight: 600; }
      .text-heading { fill: #f8fafc; font-size: 14px; font-weight: 600; }
      .text-body { fill: #94a3b8; font-size: 13px; }
      .text-muted { fill: #64748b; font-size: 11px; }
      .btn-primary { fill: #0284c7; rx: 6px; cursor: pointer; }
      .btn-primary-text { fill: #ffffff; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .btn-secondary { fill: #334155; rx: 6px; cursor: pointer; }
      .btn-secondary-text { fill: #f8fafc; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .btn-danger-outline { fill: #1e293b; stroke: #ef4444; stroke-width: 1; rx: 6px; cursor: pointer; }
      .badge-warning { fill: #78350f; stroke: #d97706; stroke-width: 1; rx: 10px; }
      .row-divider { stroke: #334155; stroke-width: 1; }
      .row-selected { fill: #0369a1; fill-opacity: 0.15; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" class="bg" />

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="60" class="header" />
  <circle cx="36" cy="30" r="14" fill="#0284c7" />
  <path d="M 30 30 L 42 22 L 38 30 L 42 38 Z" fill="#ffffff" />
  <text x="60" y="35" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">UpdatePilot</text>
  <text x="155" y="35" class="text-muted">|</text>
  <text x="170" y="35" fill="#94a3b8" font-size="13">Device: <tspan fill="#f8fafc" font-weight="600">DESKTOP-DINUSHA</tspan></text>

  <g transform="translate(930, 13)">
    <rect width="130" height="34" class="btn-primary" />
    <path d="M 18 17 A 6 6 0 1 1 18 21 M 18 12 L 21 16 L 15 16 Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <text x="74" y="22" class="btn-primary-text">Scan now</text>
  </g>
  <circle cx="1090" cy="30" r="16" fill="#334155" />
  <text x="1090" y="35" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">DU</text>

  <!-- Left Sidebar -->
  <rect x="0" y="60" width="220" height="760" class="sidebar" />
  <g transform="translate(16, 85)">
    <text x="36" y="23" class="text-body">Overview</text>
    <!-- Active Nav: Updates -->
    <rect x="0" y="40" width="188" height="36" fill="#0284c7" fill-opacity="0.2" rx="6" stroke="#0284c7" stroke-width="1" />
    <text x="36" y="63" fill="#38bdf8" font-size="13" font-weight="600">Updates (33)</text>
    <text x="36" y="103" class="text-body">Installed Apps (196)</text>
    <text x="36" y="143" class="text-body">Devices (1)</text>
    <text x="36" y="183" class="text-body">Audit &amp; History</text>
    <text x="36" y="223" class="text-body">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(244, 85)">
    <text x="0" y="22" class="text-title">Available Software Updates</text>
    <text x="0" y="44" class="text-body">33 updates detected via WinGet • Every update requires explicit user approval</text>

    <!-- Filter & Safety Banner -->
    <g transform="translate(0, 60)">
      <rect width="630" height="34" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6" />
      <circle cx="18" cy="17" r="6" fill="#0284c7" />
      <text x="18" y="21" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">i</text>
      <text x="32" y="21" fill="#94a3b8" font-size="12">Select an update to preview changes and review source manifests before approving.</text>
    </g>

    <!-- Updates Table (Left: 630px wide) -->
    <g transform="translate(0, 105)">
      <rect width="630" height="585" class="card" />

      <!-- Table Header -->
      <text x="16" y="26" class="text-muted">PACKAGE NAME</text>
      <text x="210" y="26" class="text-muted">CURRENT</text>
      <text x="310" y="26" class="text-muted">TARGET</text>
      <text x="420" y="26" class="text-muted">STATUS</text>
      <text x="530" y="26" class="text-muted">ACTION</text>
      <line x1="16" y1="36" x2="614" y2="36" class="row-divider" />

      <!-- Row 1: Git (Selected Row) -->
      <rect x="2" y="38" width="626" height="54" class="row-selected" />
      <g transform="translate(16, 48)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">Git for Windows</text>
        <text x="0" y="32" fill="#38bdf8" font-size="11">Git.Git</text>
        <text x="194" y="22" class="text-body">2.50.0.2</text>
        <text x="294" y="22" fill="#38bdf8" font-size="13" font-weight="700">2.56.0.3</text>
        <rect x="404" y="8" width="85" height="20" class="badge-warning" />
        <text x="446" y="22" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">Pending</text>
        <rect x="514" y="6" width="65" height="24" class="btn-primary" />
        <text x="546" y="22" class="btn-primary-text">Preview</text>
      </g>
      <line x1="16" y1="92" x2="614" y2="92" class="row-divider" />

      <!-- Row 2: 7-Zip -->
      <g transform="translate(16, 102)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">7-Zip 24.09 (x64)</text>
        <text x="0" y="32" class="text-muted">7zip.7zip</text>
        <text x="194" y="22" class="text-body">24.09</text>
        <text x="294" y="22" fill="#38bdf8" font-size="13" font-weight="700">26.05</text>
        <rect x="404" y="8" width="85" height="20" class="badge-warning" />
        <text x="446" y="22" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">Pending</text>
        <rect x="514" y="6" width="65" height="24" class="btn-secondary" />
        <text x="546" y="22" class="btn-secondary-text">Preview</text>
      </g>
      <line x1="16" y1="146" x2="614" y2="146" class="row-divider" />

      <!-- Row 3: Node.js LTS -->
      <g transform="translate(16, 156)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">Node.js LTS</text>
        <text x="0" y="32" class="text-muted">OpenJS.NodeJS.LTS</text>
        <text x="194" y="22" class="text-body">24.13.0</text>
        <text x="294" y="22" fill="#38bdf8" font-size="13" font-weight="700">26.13.0</text>
        <rect x="404" y="8" width="85" height="20" class="badge-warning" />
        <text x="446" y="22" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">Pending</text>
        <rect x="514" y="6" width="65" height="24" class="btn-secondary" />
        <text x="546" y="22" class="btn-secondary-text">Preview</text>
      </g>
      <line x1="16" y1="200" x2="614" y2="200" class="row-divider" />

      <!-- Row 4: VLC media player -->
      <g transform="translate(16, 210)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">VLC media player</text>
        <text x="0" y="32" class="text-muted">VideoLAN.VLC</text>
        <text x="194" y="22" class="text-body">3.0.21</text>
        <text x="294" y="22" fill="#38bdf8" font-size="13" font-weight="700">3.0.24</text>
        <rect x="404" y="8" width="85" height="20" class="badge-warning" />
        <text x="446" y="22" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">Pending</text>
        <rect x="514" y="6" width="65" height="24" class="btn-secondary" />
        <text x="546" y="22" class="btn-secondary-text">Preview</text>
      </g>
      <line x1="16" y1="254" x2="614" y2="254" class="row-divider" />

      <!-- Row 5: ChatGPT -->
      <g transform="translate(16, 264)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">ChatGPT Desktop</text>
        <text x="0" y="32" class="text-muted">OpenAI.ChatGPT</text>
        <text x="194" y="22" class="text-body">26.1007</text>
        <text x="294" y="22" fill="#38bdf8" font-size="13" font-weight="700">26.1023</text>
        <rect x="404" y="8" width="85" height="20" class="badge-warning" />
        <text x="446" y="22" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">Pending</text>
        <rect x="514" y="6" width="65" height="24" class="btn-secondary" />
        <text x="546" y="22" class="btn-secondary-text">Preview</text>
      </g>
      <line x1="16" y1="308" x2="614" y2="308" class="row-divider" />

      <!-- Row 6: Windows Terminal -->
      <g transform="translate(16, 318)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">Windows Terminal</text>
        <text x="0" y="32" class="text-muted">Microsoft.WindowsTerminal</text>
        <text x="194" y="22" class="text-body">1.24.127</text>
        <text x="294" y="22" fill="#38bdf8" font-size="13" font-weight="700">1.25.273</text>
        <rect x="404" y="8" width="85" height="20" class="badge-warning" />
        <text x="446" y="22" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">Pending</text>
        <rect x="514" y="6" width="65" height="24" class="btn-secondary" />
        <text x="546" y="22" class="btn-secondary-text">Preview</text>
      </g>
      <line x1="16" y1="362" x2="614" y2="362" class="row-divider" />

      <!-- Row 7: Cursor -->
      <g transform="translate(16, 372)">
        <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="600">Cursor (User)</text>
        <text x="0" y="32" class="text-muted">Anysphere.Cursor</text>
        <text x="194" y="22" class="text-body">3.16.17</text>
        <text x="294" y="22" fill="#38bdf8" font-size="13" font-weight="700">3.20.14</text>
        <rect x="404" y="8" width="85" height="20" class="badge-warning" />
        <text x="446" y="22" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">Pending</text>
        <rect x="514" y="6" width="65" height="24" class="btn-secondary" />
        <text x="546" y="22" class="btn-secondary-text">Preview</text>
      </g>

      <!-- Pagination bar -->
      <g transform="translate(16, 545)">
        <line x1="0" y1="0" x2="598" y2="0" class="row-divider" />
        <text x="0" y="24" class="text-muted">Showing 1 to 7 of 33 updates</text>
        <g transform="translate(420, 8)">
          <rect width="28" height="24" class="btn-secondary" />
          <text x="14" y="16" fill="#94a3b8" font-size="11" text-anchor="middle">&lt;</text>
          <rect x="34" width="28" height="24" fill="#0284c7" rx="4" />
          <text x="48" y="16" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">1</text>
          <rect x="68" width="28" height="24" class="btn-secondary" />
          <text x="82" y="16" fill="#94a3b8" font-size="11" text-anchor="middle">2</text>
          <rect x="102" width="28" height="24" class="btn-secondary" />
          <text x="116" y="16" fill="#94a3b8" font-size="11" text-anchor="middle">3</text>
          <rect x="136" width="28" height="24" class="btn-secondary" />
          <text x="150" y="16" fill="#94a3b8" font-size="11" text-anchor="middle">&gt;</text>
        </g>
      </g>
    </g>

    <!-- Preview Screen / Panel (Right: 280px wide) -->
    <g transform="translate(648, 105)">
      <rect width="280" height="585" class="card-preview" />

      <!-- Panel Header -->
      <g transform="translate(18, 20)">
        <text x="0" y="16" class="text-heading">Update Preview</text>
        <line x1="0" y1="28" x2="244" y2="28" class="row-divider" />
      </g>

      <!-- Target Package Identity -->
      <g transform="translate(18, 60)">
        <text x="0" y="14" fill="#f8fafc" font-size="15" font-weight="700">Git for Windows</text>
        <text x="0" y="30" fill="#38bdf8" font-size="12">Git.Git</text>
      </g>

      <!-- Target Device -->
      <g transform="translate(18, 105)">
        <text x="0" y="12" class="text-muted">TARGET DEVICE</text>
        <text x="0" y="28" fill="#f8fafc" font-size="13" font-weight="600">DESKTOP-DINUSHA</text>
        <text x="0" y="44" class="text-muted">Windows 11 Home (Build 26200)</text>
      </g>

      <!-- Version Diff Box -->
      <g transform="translate(18, 165)">
        <rect width="244" height="66" fill="#0f172a" rx="6" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" class="text-muted">CURRENT</text>
        <text x="14" y="44" class="text-body" font-size="14" font-weight="600">2.50.0.2</text>

        <text x="110" y="36" fill="#38bdf8" font-size="16">→</text>

        <text x="135" y="20" fill="#38bdf8" font-size="10" font-weight="600">NEW TARGET</text>
        <text x="135" y="44" fill="#38bdf8" font-size="15" font-weight="700">2.56.0.3</text>
      </g>

      <!-- Source Link & Verification -->
      <g transform="translate(18, 245)">
        <text x="0" y="12" class="text-muted">SOURCE REPOSITORY</text>
        <text x="0" y="28" fill="#38bdf8" font-size="12" text-decoration="underline">winget-pkgs/Git.Git.yaml ↗</text>
        <text x="0" y="46" class="text-muted">Verified SHA256 manifest hash</text>
      </g>

      <!-- Command to be executed -->
      <g transform="translate(18, 305)">
        <text x="0" y="12" class="text-muted">PLANNED AGENT COMMAND</text>
        <rect y="20" width="244" height="42" fill="#020617" rx="4" />
        <text x="8" y="38" fill="#e2e8f0" font-family="'Consolas', monospace" font-size="10">winget upgrade --id Git.Git</text>
        <text x="8" y="52" fill="#38bdf8" font-family="'Consolas', monospace" font-size="10">--exact --silent</text>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(18, 420)">
        <!-- Approve Button -->
        <rect width="244" height="40" class="btn-primary" />
        <text x="122" y="25" class="btn-primary-text">Approve Update...</text>

        <!-- Reject Button -->
        <g transform="translate(0, 50)">
          <rect width="244" height="34" class="btn-danger-outline" />
          <text x="122" y="21" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">Reject / Dismiss</text>
        </g>
      </g>

      <!-- Policy Guarantee Note -->
      <g transform="translate(18, 525)">
        <text x="0" y="12" fill="#64748b" font-size="10" text-anchor="start">Requires explicit confirmation in dialog.</text>
        <text x="0" y="26" fill="#64748b" font-size="10" text-anchor="start">Logged to immutable audit history.</text>
      </g>
    </g>
  </g>
</svg>
