<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Definitions & Styles -->
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .sidebar { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .header { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .card-error { fill: #1e293b; stroke: #ef4444; stroke-width: 1.5; rx: 8px; }
      .console-box { fill: #020617; stroke: #334155; stroke-width: 1; rx: 6px; }
      .text-title { fill: #f8fafc; font-size: 18px; font-weight: 600; }
      .text-heading { fill: #f8fafc; font-size: 14px; font-weight: 600; }
      .text-body { fill: #94a3b8; font-size: 13px; }
      .text-muted { fill: #64748b; font-size: 11px; }
      .btn-danger { fill: #dc2626; rx: 6px; cursor: pointer; }
      .btn-danger-text { fill: #ffffff; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .btn-secondary { fill: #334155; rx: 6px; cursor: pointer; }
      .btn-secondary-text { fill: #cbd5e1; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .banner-error { fill: #450a0a; stroke: #ef4444; stroke-width: 1; rx: 6px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" class="bg" />

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="60" class="header" />
  <circle cx="36" cy="30" r="14" fill="#0284c7" />
  <path d="M 30 30 L 42 22 L 38 30 L 42 38 Z" fill="#ffffff" />
  <text x="60" y="35" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">UpdatePilot</text>
  <text x="155" y="35" class="text-muted">|</text>
  <text x="170" y="35" fill="#94a3b8" font-size="13">Device: <tspan fill="#f8fafc" font-weight="600">DESKTOP-DINUSHA</tspan></text>
  <circle cx="430" cy="30" r="4" fill="#ef4444" />
  <text x="440" y="34" fill="#ef4444" font-size="11" font-weight="600">Installation Failed</text>

  <circle cx="1090" cy="30" r="16" fill="#334155" />
  <text x="1090" y="35" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">DU</text>

  <!-- Left Sidebar -->
  <rect x="0" y="60" width="220" height="760" class="sidebar" />
  <g transform="translate(16, 85)">
    <text x="36" y="23" class="text-body">Overview</text>
    <rect x="0" y="40" width="188" height="36" fill="#0284c7" fill-opacity="0.2" rx="6" stroke="#0284c7" stroke-width="1" />
    <text x="36" y="63" fill="#38bdf8" font-size="13" font-weight="600">Updates (33)</text>
    <text x="36" y="103" class="text-body">Installed Apps (196)</text>
    <text x="36" y="143" class="text-body">Devices (1)</text>
    <text x="36" y="183" class="text-body">Audit &amp; History</text>
    <text x="36" y="223" class="text-body">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(244, 85)">
    <!-- Breadcrumb -->
    <text x="0" y="15" fill="#38bdf8" font-size="12">← Back to Available Updates</text>
    <text x="0" y="44" class="text-title">Update Failed: Git for Windows</text>
    <text x="0" y="66" class="text-body">Package: Git.Git • Target Version: 2.56.0.3 • Host: DESKTOP-DINUSHA</text>

    <!-- Error Alert Banner -->
    <g transform="translate(0, 80)">
      <rect width="928" height="52" class="banner-error" />
      <circle cx="28" cy="26" r="11" fill="#ef4444" />
      <text x="28" y="31" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">!</text>
      <text x="50" y="24" fill="#fee2e2" font-size="13" font-weight="600">Installer Exit Code 1603 (ERROR_INSTALL_FAILURE)</text>
      <text x="50" y="40" fill="#fca5a5" font-size="11">The silent installer encountered a fatal error. The host remains on existing version 2.50.0.2 with no corrupted state.</text>
    </g>

    <!-- Failure Details Card -->
    <g transform="translate(0, 145)">
      <rect width="928" height="545" class="card" />

      <!-- Package & Host Details Header -->
      <g transform="translate(24, 20)">
        <text x="0" y="16" class="text-heading">Failure Diagnostic Report</text>
        <text x="0" y="34" class="text-muted">Recorded at 2026-10-29T17:15:45Z in Audit Log (Event ID: evt_7fa10b98)</text>
      </g>

      <line x1="24" y1="65" x2="904" y2="65" stroke="#334155" stroke-width="1" />

      <!-- Terminal Stderr Capture -->
      <g transform="translate(24, 80)">
        <text x="0" y="14" class="text-muted">SUBPROCESS LOG (STDERR):</text>
        <rect y="24" width="880" height="180" class="console-box" />

        <g transform="translate(16, 50)">
          <text x="0" y="0" fill="#f87171" font-family="'Consolas', monospace" font-size="11">[17:15:32] Starting package install...</text>
          <text x="0" y="22" fill="#f87171" font-family="'Consolas', monospace" font-size="11">[17:15:38] Another process is using file: C:\Program Files\Git\bin\git.exe</text>
          <text x="0" y="44" fill="#ef4444" font-family="'Consolas', monospace" font-size="11">[17:15:42] Installer failed with exit code: 1603 (Fatal error during installation)</text>
          <text x="0" y="66" fill="#94a3b8" font-family="'Consolas', monospace" font-size="11">[17:15:42] Installer log saved to: %TEMP%\winget\Git.Git-2026-10-29-17-15-38.log</text>
          <text x="0" y="92" fill="#e2e8f0" font-family="'Consolas', monospace" font-size="11">[17:15:43] [AGENT] Verified installed version unchanged: 2.50.0.2</text>
          <text x="0" y="114" fill="#64748b" font-family="'Consolas', monospace" font-size="11">[17:15:43] [AGENT] Reported state: FAILED to UpdatePilot API</text>
        </g>
      </g>

      <!-- Probable Causes & Recommended Next Steps -->
      <g transform="translate(24, 300)">
        <text x="0" y="16" class="text-heading">Recommended Resolution:</text>
        
        <text x="0" y="42" fill="#e2e8f0" font-size="13">1. <tspan font-weight="600">Close Running Applications</tspan>: Ensure all active Git terminals or IDE instances (e.g. VS Code, Git Bash) are closed on DESKTOP-DINUSHA.</text>
        <text x="0" y="66" fill="#e2e8f0" font-size="13">2. <tspan font-weight="600">Check Administrator Elevation</tspan>: This package installs to `C:\Program Files\Git` and requires elevated admin permissions.</text>
        <text x="0" y="90" fill="#e2e8f0" font-size="13">3. <tspan font-weight="600">Safe Idempotency</tspan>: Your system is safe and remains operational on version 2.50.0.2.</text>
      </g>

      <line x1="24" y1="430" x2="904" y2="430" stroke="#334155" stroke-width="1" />

      <!-- Action Buttons -->
      <g transform="translate(24, 460)">
        <rect width="160" height="42" class="btn-danger" />
        <text x="80" y="26" class="btn-danger-text">Retry Installation</text>

        <g transform="translate(180, 0)">
          <rect width="140" height="42" class="btn-secondary" />
          <text x="70" y="26" class="btn-secondary-text">Dismiss / Ignore</text>
        </g>

        <g transform="translate(340, 0)">
          <rect width="160" height="42" class="btn-secondary" />
          <text x="80" y="26" class="btn-secondary-text">View Audit Entry</text>
        </g>
      </g>
    </g>
  </g>
</svg>
