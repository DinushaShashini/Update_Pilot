<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Definitions & Styles -->
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .sidebar { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .header { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .text-title { fill: #f8fafc; font-size: 18px; font-weight: 600; }
      .text-heading { fill: #f8fafc; font-size: 15px; font-weight: 600; }
      .text-body { fill: #94a3b8; font-size: 13px; }
      .text-muted { fill: #64748b; font-size: 11px; }
      .btn-primary { fill: #0284c7; rx: 6px; cursor: pointer; }
      .btn-primary-text { fill: #ffffff; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .btn-disabled { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 6px; }
      .input-disabled { fill: #0f172a; stroke: #1e293b; stroke-width: 1; rx: 6px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" class="bg" />

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="60" class="header" />
  <circle cx="36" cy="30" r="14" fill="#0284c7" />
  <path d="M 30 30 L 42 22 L 38 30 L 42 38 Z" fill="#ffffff" />
  <text x="60" y="35" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">UpdatePilot</text>
  <text x="155" y="35" class="text-muted">|</text>
  <text x="170" y="35" fill="#94a3b8" font-size="13">Device: <tspan fill="#f8fafc" font-weight="600">DESKTOP-DINUSHA</tspan></text>

  <!-- Header Right Primary Action -->
  <g transform="translate(930, 13)">
    <rect width="130" height="34" class="btn-primary" />
    <path d="M 18 17 A 6 6 0 1 1 18 21 M 18 12 L 21 16 L 15 16 Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <text x="74" y="22" class="btn-primary-text">Scan now</text>
  </g>
  <circle cx="1090" cy="30" r="16" fill="#334155" />
  <text x="1090" y="35" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">DU</text>

  <!-- Left Sidebar -->
  <rect x="0" y="60" width="220" height="760" class="sidebar" />
  <g transform="translate(16, 85)">
    <text x="36" y="23" class="text-body">Overview</text>
    <text x="36" y="63" class="text-muted">Updates (0)</text>
    <rect x="0" y="80" width="188" height="36" fill="#0284c7" fill-opacity="0.2" rx="6" stroke="#0284c7" stroke-width="1" />
    <text x="36" y="103" fill="#38bdf8" font-size="13" font-weight="600">Installed Apps (0)</text>
    <text x="36" y="143" class="text-body">Devices (1)</text>
    <text x="36" y="183" class="text-body">Audit &amp; History</text>
    <text x="36" y="223" class="text-body">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(244, 85)">
    <text x="0" y="22" class="text-title">Installed Applications</text>
    <text x="0" y="44" class="text-body">Host software inventory is waiting for initial scan</text>

    <!-- Disabled Filter Toolbar -->
    <g transform="translate(0, 60)">
      <rect width="250" height="36" class="input-disabled" />
      <text x="16" y="22" class="text-muted">Search disabled until scanned</text>

      <g transform="translate(260, 0)">
        <rect width="135" height="36" class="input-disabled" />
        <text x="14" y="22" class="text-muted">Status: All (0)</text>
      </g>
    </g>

    <!-- Empty State Container -->
    <g transform="translate(0, 110)">
      <rect width="928" height="580" class="card" />

      <!-- Center Icon & Message -->
      <g transform="translate(464, 150)">
        <!-- Box / Package Icon -->
        <circle cx="0" cy="0" r="46" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5" />
        <path d="M -18 -10 L 0 -22 L 18 -10 L 0 2 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
        <path d="M -18 -10 L -18 14 L 0 26 L 0 2 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
        <path d="M 18 -10 L 18 14 L 0 26 L 0 2 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
      </g>

      <text x="464" y="240" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">No Applications Discovered Yet</text>
      <text x="464" y="270" fill="#94a3b8" font-size="14" text-anchor="middle">Your Windows PC (DESKTOP-DINUSHA) is connected and online.</text>
      <text x="464" y="292" fill="#94a3b8" font-size="14" text-anchor="middle">Run your first inventory scan to catalog installed applications and check for WinGet updates.</text>

      <!-- Primary Action CTA -->
      <g transform="translate(374, 340)">
        <rect width="180" height="42" class="btn-primary" />
        <path d="M 28 21 A 6 6 0 1 1 28 25 M 28 16 L 31 20 L 25 20 Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
        <text x="100" y="26" class="btn-primary-text">Run Initial Scan</text>
      </g>

      <!-- Safety Assurance Note -->
      <g transform="translate(244, 420)">
        <rect width="440" height="38" fill="#0f172a" rx="6" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="7" fill="#0284c7" />
        <text x="20" y="23" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">i</text>
        <text x="36" y="23" fill="#94a3b8" font-size="11">The scan runs in read-only mode using 'winget list'. It changes nothing on your PC.</text>
      </g>
    </g>
  </g>
</svg>
