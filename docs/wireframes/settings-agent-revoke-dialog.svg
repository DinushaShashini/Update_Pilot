<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Definitions & Styles -->
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .backdrop { fill: #020617; fill-opacity: 0.75; }
      .modal { fill: #1e293b; stroke: #ef4444; stroke-width: 1.5; rx: 12px; filter: drop-shadow(0 20px 25px rgba(0,0,0,0.7)); }
      .warning-box { fill: #450a0a; stroke: #ef4444; stroke-width: 1; rx: 8px; }
      .input-box { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6px; }
      .text-title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
      .text-heading { fill: #f8fafc; font-size: 14px; font-weight: 600; }
      .text-body { fill: #94a3b8; font-size: 13px; }
      .text-muted { fill: #64748b; font-size: 11px; }
      .btn-danger { fill: #dc2626; rx: 6px; cursor: pointer; }
      .btn-danger-text { fill: #ffffff; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .btn-secondary { fill: #334155; rx: 6px; cursor: pointer; }
      .btn-secondary-text { fill: #cbd5e1; font-size: 13px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Screen (Dimmed Underlay) -->
  <rect width="1200" height="820" class="bg" />
  <rect width="1200" height="820" class="backdrop" />

  <!-- Center Revoke Confirmation Modal (560px x 450px) -->
  <g transform="translate(320, 185)">
    <rect width="560" height="440" class="modal" />

    <!-- Dialog Header -->
    <g transform="translate(32, 32)">
      <circle cx="16" cy="16" r="16" fill="#7f1d1d" />
      <path d="M 16 8 L 26 24 L 6 24 Z" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="16" y1="14" x2="16" y2="18" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
      <circle cx="16" cy="21" r="1" fill="#ef4444" />

      <text x="44" y="16" fill="#f87171" font-size="18" font-weight="700">Revoke Device Pairing</text>
      <text x="44" y="34" class="text-body">Permanent disconnection of Windows host DESKTOP-DINUSHA</text>
      <text x="480" y="16" fill="#64748b" font-size="16" cursor="pointer">✕</text>
    </g>

    <line x1="32" y1="88" x2="528" y2="88" stroke="#334155" stroke-width="1" />

    <!-- Warning Explanation Box -->
    <g transform="translate(32, 108)">
      <rect width="496" height="110" class="warning-box" />

      <g transform="translate(18, 20)">
        <text x="0" y="14" fill="#fee2e2" font-size="13" font-weight="600">Are you sure you want to revoke this agent?</text>
        <text x="0" y="36" fill="#fca5a5" font-size="12">1. All active authentication tokens on DESKTOP-DINUSHA will be invalidated.</text>
        <text x="0" y="56" fill="#fca5a5" font-size="12">2. Any queued or in-progress approved updates will be terminated immediately.</text>
        <text x="0" y="76" fill="#fca5a5" font-size="12">3. The PC cannot reconnect until a new pairing token is generated.</text>
      </g>
    </g>

    <!-- Confirmation Verification Input -->
    <g transform="translate(32, 240)">
      <text x="0" y="14" class="text-body">To proceed, please type <tspan fill="#f87171" font-weight="700">REVOKE</tspan> below:</text>
      <rect y="24" width="496" height="38" class="input-box" />
      <text x="14" y="48" fill="#f8fafc" font-family="'Consolas', monospace" font-size="14" font-weight="700">REVOKE</text>
      <line x1="72" y1="36" x2="72" y2="52" stroke="#38bdf8" stroke-width="1.5" />
    </g>

    <line x1="32" y1="350" x2="528" y2="350" stroke="#334155" stroke-width="1" />

    <!-- Action Buttons -->
    <g transform="translate(32, 370)">
      <rect width="110" height="42" class="btn-secondary" />
      <text x="55" y="26" class="btn-secondary-text">Cancel</text>

      <g transform="translate(266, 0)">
        <rect width="230" height="42" class="btn-danger" />
        <path d="M 24 21 L 34 21 M 29 16 L 34 21 L 29 26" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <text x="125" y="26" class="btn-danger-text">Revoke Device Authorization</text>
      </g>
    </g>
  </g>
</svg>
