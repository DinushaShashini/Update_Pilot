<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Definitions & Styles -->
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .sidebar { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .header { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .text-title { fill: #f8fafc; font-size: 18px; font-weight: 600; }
      .text-heading { fill: #f8fafc; font-size: 15px; font-weight: 600; }
      .text-body { fill: #94a3b8; font-size: 13px; }
      .text-muted { fill: #64748b; font-size: 11px; }
      .btn-danger { fill: #dc2626; rx: 6px; cursor: pointer; }
      .btn-danger-text { fill: #ffffff; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .btn-secondary { fill: #334155; rx: 6px; cursor: pointer; }
      .btn-secondary-text { fill: #cbd5e1; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .banner-error { fill: #450a0a; stroke: #ef4444; stroke-width: 1; rx: 6px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" class="bg" />

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="60" class="header" />
  <circle cx="36" cy="30" r="14" fill="#0284c7" />
  <path d="M 30 30 L 42 22 L 38 30 L 42 38 Z" fill="#ffffff" />
  <text x="60" y="35" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">UpdatePilot</text>
  <text x="155" y="35" class="text-muted">|</text>
  <text x="170" y="35" fill="#94a3b8" font-size="13">Device: <tspan fill="#f8fafc" font-weight="600">DESKTOP-DINUSHA</tspan></text>

  <!-- Header Right Action -->
  <g transform="translate(930, 13)">
    <rect width="130" height="34" class="btn-danger" />
    <text x="65" y="22" class="btn-danger-text">Retry load</text>
  </g>
  <circle cx="1090" cy="30" r="16" fill="#334155" />
  <text x="1090" y="35" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">DU</text>

  <!-- Left Sidebar -->
  <rect x="0" y="60" width="220" height="760" class="sidebar" />
  <g transform="translate(16, 85)">
    <text x="36" y="23" class="text-body">Overview</text>
    <text x="36" y="63" class="text-body">Updates (33)</text>
    <text x="36" y="103" class="text-body">Installed Apps (196)</text>
    <text x="36" y="143" class="text-body">Devices (1)</text>
    <rect x="0" y="160" width="188" height="36" fill="#0284c7" fill-opacity="0.2" rx="6" stroke="#0284c7" stroke-width="1" />
    <text x="36" y="183" fill="#38bdf8" font-size="13" font-weight="600">Audit &amp; History</text>
    <text x="36" y="223" class="text-body">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(244, 85)">
    <text x="0" y="22" class="text-title">Job &amp; Audit History</text>
    <text x="0" y="44" fill="#ef4444" font-size="13">Error retrieving audit log ledger from database</text>

    <!-- Error Alert Banner -->
    <g transform="translate(0, 58)">
      <rect width="928" height="50" class="banner-error" />
      <circle cx="28" cy="25" r="11" fill="#ef4444" />
      <text x="28" y="30" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">!</text>
      <text x="50" y="24" fill="#fee2e2" font-size="13" font-weight="600">Audit Ledger Query Error: Prisma Client Initialization / Connection Failed (HTTP 500)</text>
      <text x="50" y="40" fill="#fca5a5" font-size="11">Could not connect to PostgreSQL server at 127.0.0.1:5432. The database service may be offline.</text>
    </g>

    <!-- Error Body Container -->
    <g transform="translate(0, 120)">
      <rect width="928" height="570" class="card" />

      <!-- Center Warning Icon -->
      <g transform="translate(464, 130)">
        <circle cx="0" cy="0" r="44" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
        <path d="M 0 -18 L 18 16 L -18 16 Z" fill="none" stroke="#ef4444" stroke-width="2" />
        <line x1="0" y1="-4" x2="0" y2="4" stroke="#ef4444" stroke-width="2" />
        <circle cx="0" cy="10" r="1.5" fill="#ef4444" />
      </g>

      <text x="464" y="210" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Unable to Load Audit History</text>
      <text x="464" y="240" fill="#94a3b8" font-size="14" text-anchor="middle">The backend was unable to reach the PostgreSQL audit log store.</text>
      <text x="464" y="262" fill="#94a3b8" font-size="14" text-anchor="middle">Your past audit events are safely preserved on disk once the database reconnects.</text>

      <!-- Diagnostic Snippet Box -->
      <g transform="translate(264, 295)">
        <rect width="400" height="95" fill="#020617" stroke="#334155" stroke-width="1" rx="6" />
        <text x="16" y="24" fill="#ef4444" font-family="'Consolas', monospace" font-size="11">Error: P1001 Can't reach database server</text>
        <text x="16" y="44" fill="#94a3b8" font-family="'Consolas', monospace" font-size="11">Datasource: postgresql://postgres:***@localhost:5432/updatepilot</text>
        <text x="16" y="64" fill="#94a3b8" font-family="'Consolas', monospace" font-size="11">Table: AuditLog (Operation: findMany)</text>
        <text x="16" y="84" fill="#64748b" font-family="'Consolas', monospace" font-size="10">Trace ID: trace_7fa9180bc</text>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(394, 420)">
        <rect width="140" height="38" class="btn-danger" />
        <text x="70" y="24" class="btn-danger-text">Retry Query</text>

        <g transform="translate(155, 0)">
          <rect width="110" height="38" class="btn-secondary" />
          <text x="55" y="24" class="btn-secondary-text">Server Status</text>
        </g>
      </g>
    </g>
  </g>
</svg>
